# Placeholder values so the Spring context can start without external services.
# Nothing here connects eagerly: the reactive Mongo client and the JWT decoder
# both resolve lazily, so the context boots and bean wiring is actually verified.
spring.application.name=events-test
server.port=0

spring.mongodb.uri=mongodb://localhost:27017/events-test
spring.data.mongodb.auto-index-creation=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

logging.level.root=WARN
social.api.url=http://localhost:9
app.media-api.url=http://localhost:9

# Kafka: the test binder must neither create topics nor reach a broker, and the relay must not
# poll one twice a second for the length of the build. EventGroupRelayTest covers it directly.
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.auto-create-topics=false
app.event-group.relay.enabled=false
app.event-deletion.relay.enabled=false
app.event-date-fixed.relay.enabled=false
# No broker for USER_DELETED either: UserDeletedConsumerTest drives the function directly.
app.user-deleted.consumer.enabled=false
# No reconciliation loop either: DeletedUsersReconciliationLoopTest drives it directly.
app.account-erasure.reconciliation.enabled=false
# No broker for USER_BIRTHDAY, FRIENDSHIP_STATE, FRIENDSHIP_CHANGED, BIRTHDAY_NOTICES nor FRIENDSHIP_NOTICES, and no scheduler: their tests drive them directly.
app.user-birthday.consumer.enabled=false
app.friendship-state.consumer.enabled=false
app.friendships.consumer.enabled=false
app.birthday-notices.relay.enabled=false
app.friendship-notices.relay.enabled=false
app.birthday-reminders.enabled=false
# No database to count outboxes in: OutboxBacklogGaugeTest drives the refresh directly.
app.outbox-backlog.enabled=false

# is what separates them. No default in application.properties on purpose — a service
# that cannot name its topic must not start rather than join another environment's traffic.

# One broker serves every environment and the prefix is what separates them, so a single variable
# carries it: dev., prod., test. No default on purpose — a service that cannot name its topics must
# refuse to start rather than join another environment's traffic.
TOPIC_PREFIX=test.
