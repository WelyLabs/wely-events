spring.application.name=events
server.port=8086

# Production configuration
spring.mongodb.uri=${MONGODB_URI}
# Under spring.data, unlike the URI: it belongs to the Data layer (see CLAUDE.md, Boot 4).
spring.data.mongodb.auto-index-creation=true

# wely-social, asked for the requester's friends before a free-slot search.
social.api.url=${SOCIAL_API_URL}

# --- wely-media: covers and receipts ----------------------------------------
# Stores the pictures and signs their URLs; reached inside the cluster only, with a shared secret.
# The secret defaults to empty so the service starts before it is deployed: wely-media then
# refuses every call, uploads answer EVT-TEC-003 and pictures come back without a URL.
app.media-api.url=${MEDIA_API_URL}
app.media-api.secret=${MEDIA_API_SECRET:}
# Uploads are capped at 10 MB in the controllers; this leaves room for the multipart envelope.
spring.webflux.multipart.max-in-memory-size=11MB

# --- Kafka: EVENT_GROUP_CHANGED ---------------------------------------------
# Every change to who takes part is sent to wely-chat, which keeps the event's group conversation
# in step. The topic must exist beforehand: the binder may not create topics.
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER}
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.kafka.binder.auto-add-partitions=false
spring.cloud.stream.kafka.binder.producer-properties.acks=all

spring.cloud.stream.bindings.eventGroup-out-0.destination=EVENT_GROUP_CHANGED
spring.cloud.stream.bindings.eventGroup-out-0.content-type=application/json
# Keyed by event, so one event's lists stay in order on one partition.
spring.cloud.stream.bindings.eventGroup-out-0.producer.partition-key-expression=payload.eventId

# The events collection is its own outbox (see EventGroupRelay).
app.event-group.relay.enabled=${EVENT_GROUP_RELAY_ENABLED:true}
app.event-group.relay.poll-interval=2s
app.event-group.relay.batch-size=100
# A deleted event's document is gone: its tombstone in event_deletions is sent instead (see EventDeletionRelay).
app.event-deletion.relay.enabled=${EVENT_DELETION_RELAY_ENABLED:true}
app.event-deletion.relay.poll-interval=2s
app.event-deletion.relay.batch-size=100

# --- Kafka: EVENT_DATE_FIXED ------------------------------------------------
# A date fixed by a poll is sent to wely-chat, which announces it in the event's group.
spring.cloud.stream.bindings.eventDateFixed-out-0.destination=${EVENT_DATE_FIXED_TOPIC:EVENT_DATE_FIXED}
spring.cloud.stream.bindings.eventDateFixed-out-0.content-type=application/json
spring.cloud.stream.bindings.eventDateFixed-out-0.producer.partition-key-expression=payload.eventId

# Same outbox pattern as the group (see EventDateFixedRelay).
app.event-date-fixed.relay.enabled=${EVENT_DATE_FIXED_RELAY_ENABLED:true}
app.event-date-fixed.relay.poll-interval=2s
app.event-date-fixed.relay.batch-size=100

# --- Kafka: USER_DELETED ----------------------------------------------------
# Accounts wely-users deleted, erased here by AccountErasureService; one group shared by every pod.
app.user-deleted.consumer.enabled=${USER_DELETED_CONSUMER_ENABLED:true}
spring.cloud.function.definition=userDeleted
spring.cloud.stream.bindings.userDeleted-in-0.destination=USER_DELETED
spring.cloud.stream.bindings.userDeleted-in-0.group=events-service-group
spring.cloud.stream.kafka.bindings.userDeleted-in-0.consumer.start-offset=earliest

# Demo accounts, comma-separated businessIds: never erased, never handed an event automatically.
app.account-deletion.protected-user-ids=${ACCOUNT_DELETION_PROTECTED_USER_IDS:}

# Live poll votes (SSE): a comment every 20 s keeps proxies (Cloudflare cuts at 100 s idle) from closing it.
app.poll.keep-alive=20s

# Keycloak Hybrid Discovery/Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

logging.level.root=INFO
logging.level.com.calendar.events=INFO

# Framework-raised errors answer in the same RFC 7807 shape as GlobalErrorHandler's.
spring.webflux.problemdetails.enabled=true

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed. Everything else — env, beans, heapdump,
# loggers — stays off: those endpoints describe the internals and, on a cluster
# without a NetworkPolicy, anything inside can reach them.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   /actuator/health/liveness  — is the process broken beyond recovery?
#   /actuator/health/readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true
